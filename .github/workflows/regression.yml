name: Regression tests

on:
  push:
    branches:
      - main
      - "audit/**"
      - "phase-2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check auth.js
          node --check data-validation.js
          node --check weekly-challenges.js
          node --check board-settings-core.js
      - name: Run Node.js regression tests
        run: node --test tests/*.test.cjs

      - name: Set up Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
      - name: Type-check weekly leaderboard Edge Function
        run: deno check supabase/functions/weekly-challenge-submit/index.ts

      - name: Install Playwright
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:browser
