name: Regression tests

on:
  push:
    branches:
      - main
      - "audit/**"
      - "phase-4/**"
      - "phase-5/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check auth.js
          node --check data-validation.js
          node --check mastery-engine.js
          node --check adaptive-coach.js
      - name: Run backup validation regression tests
        run: node --test tests/*.test.cjs
